# Specs for The Lesli Framework
# -·-   -·-   -·-   -·-   -·-   -·-   -·-   -·-   -·-   -·-   -·-   -·-   -·-
name: "Lesli CI"
on:
  push:
    branches: [master]  # Execute when push only for the master branch
  workflow_dispatch:    # This allows the action to be executed on demand
  workflow_call:        # This makes it reusable across all the lesli repos
  pull_request:         # Execute this workflow automatic on any new PR

jobs:
  lesli-test-email-templates:
    name: Validate email templates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Compile and validate email templates
        run: make test.mails

  ci:
    name: "Test and build Ruby gem"
    uses: LesliTech/LesliActions/.github/workflows/lesli-ci-gem.yaml@master
    with:
      ruby-version: "3.3.5"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
